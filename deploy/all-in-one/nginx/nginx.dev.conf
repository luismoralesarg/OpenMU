events {
}

http {
    # this is required to proxy Grafana Live WebSocket connections.
    map $http_upgrade $connection_upgrade {
      default upgrade;
      '' close;
    }

  server {
    auth_basic           "Protected Site";
    auth_basic_user_file /etc/nginx/.htpasswd;

    listen 80;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # valid=10s: don't trust whatever TTL Docker's embedded DNS hands
    # back for a container name (it's sometimes 0, which some nginx
    # versions treat as "cache forever" instead of "don't cache") - so
    # every proxy_pass below that targets a $variable actually re-resolves
    # on a short, known interval instead.
    resolver 127.0.0.11 ipv6=off valid=10s;

    # mu-api: the mobile app authenticates itself (JWT), not via
    # .htpasswd - no admin credentials to hand out to app users.
    #
    # proxy_pass targets mu-api through a variable, not a literal
    # hostname - with a literal host, nginx resolves it once (at startup
    # or the last `nginx -s reload`) and caches that IP for the life of
    # the worker process. Every redeploy of mu-api (docker compose build
    # + up) recreates the container with a new IP, which would otherwise
    # leave this pointing at a dead address until someone remembers to
    # reload nginx-80 - a variable forces resolution through the
    # `resolver` above on every request instead.
    #
    # That variable comes at a cost: once proxy_pass's target host is a
    # variable, nginx stops doing its usual "strip the matched location
    # prefix and splice in whatever's left of the URI" rewrite - whatever
    # URI is written after the variable (here, plain "/") is sent to the
    # upstream *verbatim*, so every request under /api/ was reaching
    # mu-api as a bare "GET /" regardless of the actual path, which
    # mu-api's router has no handler for. rewrite ...break strips the
    # /api/ prefix ourselves before an URI-less proxy_pass (the one form
    # that does forward the current, already-rewritten URI untouched).
    location /api/ {
       auth_basic off;
       set $mu_api_upstream mu-api;
       rewrite ^/api/(.*)$ /$1 break;
       proxy_pass http://$mu_api_upstream:8081;
    }

    # Variable, not a literal hostname - see the /api/ location above for
    # why. This one bit us for real: openmu-startup barely ever restarted
    # on its own before it started building from our fork's source (see
    # docker-compose.prod.yml) - now every source change that changes the
    # image recreates it with a new IP, and a literal hostname here would
    # keep pointing at the dead one until someone remembered to reload
    # nginx-80 (exactly the 502 "Connection refused" this was caught by).
    location / {
       set $openmu_upstream openmu-startup;
       proxy_pass http://$openmu_upstream:8080;
    }
  }

  # mupalmira.com.ar (+ www) -> mu-web. No auth_basic here at all (it's
  # not inherited from the server block above, each server{} is its own
  # context) - the public site needs no login. mu-web must be attached
  # to this compose network (docker network connect all-in-one_default
  # mu-web) for the hostname below to resolve.
  server {
    listen 80;
    server_name mupalmira.com.ar www.mupalmira.com.ar;

    resolver 127.0.0.11 ipv6=off valid=10s;

    # Variable, not a literal hostname - see the /api/ location above for
    # why (mu-web gets redeployed just as often as mu-api).
    location / {
       set $mu_web_upstream mu-web;
       proxy_pass http://$mu_web_upstream:80;
    }
  }

  # api.mupalmira.com.ar -> mu-api, at the root this time (no /api/
  # prefix - the old prefix-based route above stays for the mobile app
  # until it's rebuilt pointing at this subdomain instead).
  server {
    listen 80;
    server_name api.mupalmira.com.ar;

    resolver 127.0.0.11 ipv6=off valid=10s;

    # Variable, not a literal hostname - see the /api/ location in the
    # first server{} block above for why. No trailing "/" after the
    # variable this time (unlike that block, this one doesn't need to
    # strip anything off the URI) - with a variable, proxy_pass sends
    # whatever URI follows it verbatim, so a trailing "/" here would
    # send every request to mu-api as a bare "GET /" instead of the
    # actual requested path. Omitting the URI entirely is what makes
    # proxy_pass forward the original request URI untouched.
    location / {
       set $mu_api_upstream mu-api;
       proxy_pass http://$mu_api_upstream:8081;
    }
  }
}
