events {
}

http {
    # this is required to proxy Grafana Live WebSocket connections.
    map $http_upgrade $connection_upgrade {
      default upgrade;
      '' close;
    }

  server {
    auth_basic           "Protected Site";
    auth_basic_user_file /etc/nginx/.htpasswd;

    listen 80;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    resolver 127.0.0.11 ipv6=off;

    # mu-api: the mobile app authenticates itself (JWT), not via
    # .htpasswd - no admin credentials to hand out to app users.
    location /api/ {
       auth_basic off;
       proxy_pass http://mu-api:8081/;
    }

    location / {
       proxy_pass http://openmu-startup:8080;
    }
  }

  # mupalmira.com.ar (+ www) -> mu-web. No auth_basic here at all (it's
  # not inherited from the server block above, each server{} is its own
  # context) - the public site needs no login. mu-web must be attached
  # to this compose network (docker network connect all-in-one_default
  # mu-web) for the hostname below to resolve.
  server {
    listen 80;
    server_name mupalmira.com.ar www.mupalmira.com.ar;

    resolver 127.0.0.11 ipv6=off;

    location / {
       proxy_pass http://mu-web:80;
    }
  }

  # api.mupalmira.com.ar -> mu-api, at the root this time (no /api/
  # prefix - the old prefix-based route above stays for the mobile app
  # until it's rebuilt pointing at this subdomain instead).
  server {
    listen 80;
    server_name api.mupalmira.com.ar;

    resolver 127.0.0.11 ipv6=off;

    location / {
       proxy_pass http://mu-api:8081/;
    }
  }
}
