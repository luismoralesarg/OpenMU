events {
}

http {
    # this is required to proxy Grafana Live WebSocket connections.
    map $http_upgrade $connection_upgrade {
      default upgrade;
      '' close;
    }

    server {
        listen 443 default_server ssl http2;
        listen [::]:443 ssl http2;

        include conf.d/nginx.server_name.conf;
        include conf.d/nginx.prod.certificates.conf;

        auth_basic           "Protected Site";
        auth_basic_user_file /etc/nginx/.htpasswd;

        listen 80;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        resolver 127.0.0.11 ipv6=off;

        # mu-api: the mobile app authenticates itself (JWT), not via
        # .htpasswd - no admin credentials to hand out to app users.
        #
        # /api/ is the legacy prefix the mobile app used before it pointed
        # straight at api.mupalmira.com.ar. /public/, /mobile/ and /admin/
        # are mu-api's actual route prefixes (see
        # mu-api/internal/adapters/inbound/http/router.go) - the website
        # and any client hitting this host without the old /api/ prefix
        # need these too, otherwise they silently fall through to the
        # location / below and get a 404 from the AdminPanel instead of
        # from mu-api.
        #
        # proxy_pass's target host is a variable (see comment on the dev
        # config's own /api/ location for why) - which means nginx skips
        # its usual "strip the matched location prefix, splice the rest
        # of the URI onto proxy_pass's own URI" rewrite. Whatever URI is
        # written after the variable goes to the upstream verbatim, so
        # e.g. every request under /public/ was reaching mu-api as a bare
        # "GET /public/" no matter the actual path. rewrite ...break
        # strips each prefix ourselves before an URI-less proxy_pass (the
        # one form that forwards the current, already-rewritten URI as-is).
        location /api/ {
           auth_basic off;
           set $mu_api_upstream mu-api;
           rewrite ^/api/(.*)$ /$1 break;
           proxy_pass http://$mu_api_upstream:8081;
        }

        location /public/ {
           auth_basic off;
           set $mu_api_upstream mu-api;
           proxy_pass http://$mu_api_upstream:8081;
        }

        location /mobile/ {
           auth_basic off;
           set $mu_api_upstream mu-api;
           proxy_pass http://$mu_api_upstream:8081;
        }

        location /admin/ {
           auth_basic off;
           set $mu_api_upstream mu-api;
           proxy_pass http://$mu_api_upstream:8081;
        }

        location / {
           proxy_pass http://openmu-startup:8080;
        }
    }
}
