services:
  nginx-80:
    image: nginx:alpine
    container_name: nginx-80
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.dev.conf:/etc/nginx/nginx.conf:ro
      - ./.htpasswd:/etc/nginx/.htpasswd
    depends_on:
      - openmu-startup
      - mu-api

  openmu-startup:
    image: munique/openmu
    container_name: openmu-startup
    ports:
      - "8080"
      - "55901:55901"
      - "55902:55902"
      - "55903:55903"
      - "55904:55904"
      - "55905:55905"
      - "55906:55906"
      - "44405:44405"
      - "44406:44406"
      - "55980:55980"
    environment:
      DB_HOST: database
      ASPNETCORE_URLS: http://+:8080
    working_dir: /app/
    volumes:
      - ./.htpasswd:/etc/nginx/.htpasswd
      - ./plugins:/app/plugins:ro
    depends_on:
      - database

  mu-api:
    build:
      context: ../../../mu-api
    container_name: mu-api
    environment:
      LISTEN_ADDR: ":8081"
      POSTGRES_DSN: "postgres://postgres:admin@database:5432/openmu?sslmode=disable"
      JWT_SECRET: ${MU_API_JWT_SECRET:?Set MU_API_JWT_SECRET in deploy/all-in-one/.env}
      WEBHOOK_SECRET: ${MU_API_WEBHOOK_SECRET:?Set MU_API_WEBHOOK_SECRET in deploy/all-in-one/.env}
      OPENMU_BASE_URL: "http://openmu-startup:8080"
      FIREBASE_CREDENTIALS_FILE: /run/secrets/firebase-credentials.json
      RECAPTCHA_SITE_KEY: ${MU_API_RECAPTCHA_SITE_KEY:-}
      RECAPTCHA_SECRET_KEY: ${MU_API_RECAPTCHA_SECRET_KEY:-}
    volumes:
      - ${MU_API_FIREBASE_CREDENTIALS_PATH:-/root/secrets/firebase-credentials.json}:/run/secrets/firebase-credentials.json:ro
    depends_on:
      - database

  database:
    image: postgres
    container_name: database
    environment:
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: openmu
      POSTGRES_USER: postgres
    ports:
      - "5432"
    volumes:
      - dbdata:/var/lib/postgresql #store data on volume

volumes:
  dbdata:
